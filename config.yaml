# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

audio:
  dashscope:
    default_model: next
    ssml_model: flash
    enrollment_model: flash
    models:
      next:
        model: qwen-audio-3.1-tts-next
        protocol: audio_generation
        sample_rate: 48000
        channels: 2
        max_prompt_length: 3000
        max_references: 3
        max_reference_seconds: 30
        max_reference_bytes: 10485760
      flash:
        model: qwen-audio-3.1-tts-flash
        protocol: tts
        sample_rate: 24000
        channels: 1
        default_voice: longanhuan_v3.1
        multi_voice_ssml: false

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
